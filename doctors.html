<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records - Doctors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Patient Records</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="patient.html">
                    <span class="icon">👤</span>
                    <span>Patients</span>
                </a>
                <a href="appointment.html">
                    <span class="icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="doctors.html" class="active">
                    <span class="icon">👨‍⚕️</span>
                    <span>Doctors</span>
                </a>
                <a href="history.html">
                    <span class="icon">📋</span>
                    <span>Medical History</span>
                </a>
                <a href="prescription.html">
                    <span class="icon">💊</span>
                    <span>Prescriptions</span>
                </a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="page-title">
                    <h2>👨‍⚕️ Doctors</h2>
                    <p>Manage doctor directory</p>
                </div>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Doctors Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>All Doctors</h3>
                    <div class="table-actions">
                        <input type="text" id="searchDoctor" placeholder="🔍 Search doctors..." oninput="filterDoctors()">
                        <button class="btn btn-primary" onclick="openDoctorModal()">+ Add Doctor</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Specialty</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Available</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="doctorsTable">
                        <tr>
                            <td colspan="6" style="text-align:center;color:var(--text-secondary);">Loading doctors...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Doctor Modal -->
    <div class="modal-overlay" id="doctorModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="doctorModalTitle">Add Doctor</h3>
                <button class="modal-close" onclick="closeModal('doctorModal')">×</button>
            </div>
            <form id="doctorForm" onsubmit="saveDoctor(event)">
                <input type="hidden" id="editDoctorId">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="doctorName" placeholder="Dr. Jane Smith" required>
                </div>
                <div class="form-group">
                    <label>Specialty *</label>
                    <select id="doctorSpecialty" required>
                        <option value="">Select Specialty</option>
                        <option value="Cardiology">Cardiology</option>
                        <option value="Dermatology">Dermatology</option>
                        <option value="Emergency Medicine">Emergency Medicine</option>
                        <option value="Endocrinology">Endocrinology</option>
                        <option value="Family Medicine">Family Medicine</option>
                        <option value="Gastroenterology">Gastroenterology</option>
                        <option value="Neurology">Neurology</option>
                        <option value="Obstetrics">Obstetrics</option>
                        <option value="Oncology">Oncology</option>
                        <option value="Ophthalmology">Ophthalmology</option>
                        <option value="Orthopedics">Orthopedics</option>
                        <option value="Pediatrics">Pediatrics</option>
                        <option value="Psychiatry">Psychiatry</option>
                        <option value="Pulmonology">Pulmonology</option>
                        <option value="Radiology">Radiology</option>
                        <option value="Surgery">Surgery</option>
                        <option value="Urology">Urology</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="doctorEmail" placeholder="doctor@hospital.com">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="text" id="doctorPhone" placeholder="+1 234 567 890">
                </div>
                <div class="form-group">
                    <label>Available Days</label>
                    <input type="text" id="doctorAvailability" placeholder="Mon-Fri, 9:00 AM - 5:00 PM">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('doctorModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Doctor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
