<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records - Appointments</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Patient Records</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="patient.html">
                    <span class="icon">👤</span>
                    <span>Patients</span>
                </a>
                <a href="appointment.html" class="active">
                    <span class="icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="doctors.html">
                    <span class="icon">👨‍⚕️</span>
                    <span>Doctors</span>
                </a>
                <a href="history.html">
                    <span class="icon">📋</span>
                    <span>Medical History</span>
                </a>
                <a href="prescription.html">
                    <span class="icon">💊</span>
                    <span>Prescriptions</span>
                </a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="page-title">
                    <h2>📅 Appointments</h2>
                    <p>Schedule and manage appointments</p>
                </div>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Appointment Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>All Appointments</h3>
                    <div class="table-actions">
                        <input type="date" id="filterDate" onchange="filterAppointments()">
                        <button class="btn btn-primary" onclick="openAppointmentModal()">+ Book Appointment</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Doctor</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTable">
                        <tr>
                            <td colspan="6" style="text-align:center;color:var(--text-secondary);">Loading appointments...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Appointment Modal -->
    <div class="modal-overlay" id="appointmentModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="appointmentModalTitle">Book Appointment</h3>
                <button class="modal-close" onclick="closeModal('appointmentModal')">×</button>
            </div>
            <form id="appointmentForm" onsubmit="saveAppointment(event)">
                <input type="hidden" id="editAppointmentId">
                <div class="form-group">
                    <label>Patient *</label>
                    <select id="appointmentPatient" required>
                        <option value="">Select Patient</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor *</label>
                    <select id="appointmentDoctor" required>
                        <option value="">Select Doctor</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="appointmentDate" required>
                    </div>
                    <div class="form-group">
                        <label>Time *</label>
                        <input type="time" id="appointmentTime" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Reason</label>
                    <input type="text" id="appointmentReason" placeholder="Reason for visit">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('appointmentModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Appointment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
