<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records - Prescriptions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Patient Records</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="patient.html">
                    <span class="icon">👤</span>
                    <span>Patients</span>
                </a>
                <a href="appointment.html">
                    <span class="icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="doctors.html">
                    <span class="icon">👨‍⚕️</span>
                    <span>Doctors</span>
                </a>
                <a href="history.html">
                    <span class="icon">📋</span>
                    <span>Medical History</span>
                </a>
                <a href="prescription.html" class="active">
                    <span class="icon">💊</span>
                    <span>Prescriptions</span>
                </a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="page-title">
                    <h2>💊 Prescriptions</h2>
                    <p>Manage patient prescriptions</p>
                </div>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Prescriptions Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>All Prescriptions</h3>
                    <div class="table-actions">
                        <input type="text" id="searchPrescription" placeholder="🔍 Search prescriptions..." oninput="filterPrescriptions()">
                        <button class="btn btn-primary" onclick="openPrescriptionModal()">+ Add Prescription</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Patient</th>
                            <th>Medication</th>
                            <th>Dosage</th>
                            <th>Refill</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="prescriptionsTable">
                        <tr>
                            <td colspan="6" style="text-align:center;color:var(--text-secondary);">Loading prescriptions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Prescription Modal -->
    <div class="modal-overlay" id="prescriptionModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="prescriptionModalTitle">Add Prescription</h3>
                <button class="modal-close" onclick="closeModal('prescriptionModal')">×</button>
            </div>
            <form id="prescriptionForm" onsubmit="savePrescription(event)">
                <input type="hidden" id="editPrescriptionId">
                <div class="form-group">
                    <label>Patient *</label>
                    <select id="prescriptionPatient" required>
                        <option value="">Select Patient</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Doctor *</label>
                    <select id="prescriptionDoctor" required>
                        <option value="">Select Doctor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Medication *</label>
                    <input type="text" id="prescriptionMedication" placeholder="e.g., Lisinopril" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Dosage</label>
                        <input type="text" id="prescriptionDosage" placeholder="e.g., 10mg">
                    </div>
                    <div class="form-group">
                        <label>Refill Date</label>
                        <input type="date" id="prescriptionRefill">
                    </div>
                </div>
                <div class="form-group">
                    <label>Instructions</label>
                    <input type="text" id="prescriptionInstructions" placeholder="Take once daily with food">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('prescriptionModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Prescription</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
