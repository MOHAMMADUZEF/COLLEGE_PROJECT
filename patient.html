<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records - Patients</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Patient Records</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="patient.html" class="active">
                    <span class="icon">👤</span>
                    <span>Patients</span>
                </a>
                <a href="appointment.html">
                    <span class="icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="doctors.html">
                    <span class="icon">👨‍⚕️</span>
                    <span>Doctors</span>
                </a>
                <a href="history.html">
                    <span class="icon">📋</span>
                    <span>Medical History</span>
                </a>
                <a href="prescription.html">
                    <span class="icon">💊</span>
                    <span>Prescriptions</span>
                </a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="page-title">
                    <h2>👤 Patients</h2>
                    <p>Manage patient records</p>
                </div>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Patient Table -->
            <div class="table-container">
                <div class="table-header">
                    <h3>All Patients</h3>
                    <div class="table-actions">
                        <input type="text" id="searchPatient" placeholder="🔍 Search patients..." oninput="filterPatients()">
                        <button class="btn btn-primary" onclick="openPatientModal()">+ Add Patient</button>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>ID</th>
                            <th>Contact</th>
                            <th>Emergency Contact</th>
                            <th>Insurance</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="patientsTable">
                        <tr>
                            <td colspan="7" style="text-align:center;color:var(--text-secondary);">Loading patients...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Patient Modal -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="patientModalTitle">Add Patient</h3>
                <button class="modal-close" onclick="closeModal('patientModal')">×</button>
            </div>
            <form id="patientForm" onsubmit="savePatient(event)">
                <input type="hidden" id="editPatientId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="patientName" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <input type="date" id="patientDob">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="patientEmail" placeholder="patient@email.com">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" id="patientPhone" placeholder="+1 234 567 890">
                    </div>
                    <div class="form-group">
                        <label>Emergency Contact</label>
                        <input type="text" id="patientEmergency" placeholder="+1 234 567 891">
                    </div>
                </div>
                <div class="form-group">
                    <label>Insurance Provider</label>
                    <input type="text" id="patientInsurance" placeholder="Insurance company">
                </div>
                <div class="form-group">
                    <label>Insurance Policy #</label>
                    <input type="text" id="patientPolicy" placeholder="Policy number">
                </div>
                <div class="form-group">
                    <label>Allergies (separate with commas)</label>
                    <input type="text" id="patientAllergies" placeholder="Peanuts, Penicillin, Latex">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('patientModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Patient</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
