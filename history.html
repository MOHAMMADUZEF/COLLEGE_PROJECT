<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Records - Medical History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">🏥</span>
                <span class="brand-text">Patient Records</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html">
                    <span class="icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="patient.html">
                    <span class="icon">👤</span>
                    <span>Patients</span>
                </a>
                <a href="appointment.html">
                    <span class="icon">📅</span>
                    <span>Appointments</span>
                </a>
                <a href="doctors.html">
                    <span class="icon">👨‍⚕️</span>
                    <span>Doctors</span>
                </a>
                <a href="history.html" class="active">
                    <span class="icon">📋</span>
                    <span>Medical History</span>
                </a>
                <a href="prescription.html">
                    <span class="icon">💊</span>
                    <span>Prescriptions</span>
                </a>
            </nav>
            <button class="logout-btn" onclick="logout()">
                <span class="icon">🚪</span>
                <span>Logout</span>
            </button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="topbar">
                <div class="page-title">
                    <h2>📋 Medical History</h2>
                    <p>View and manage patient medical records</p>
                </div>
                <div class="user-info">
                    <span id="usernameDisplay">Admin</span>
                    <div class="user-avatar">A</div>
                </div>
            </div>

            <!-- Patient Selector -->
            <div class="filter-bar">
                <select id="historyPatientFilter" onchange="loadMedicalHistory()">
                    <option value="">Select Patient</option>
                </select>
                <button class="btn btn-primary" onclick="openRecordModal()">+ Add Record</button>
            </div>

            <!-- Timeline View -->
            <div class="timeline-container" id="timelineContainer">
                <div style="text-align:center;color:var(--text-secondary);padding:3rem;">
                    Select a patient to view their medical history
                </div>
            </div>
        </main>
    </div>

    <!-- Medical Record Modal -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="recordModalTitle">Add Medical Record</h3>
                <button class="modal-close" onclick="closeModal('recordModal')">×</button>
            </div>
            <form id="recordForm" onsubmit="saveMedicalRecord(event)">
                <input type="hidden" id="editRecordId">
                <div class="form-group">
                    <label>Patient *</label>
                    <select id="recordPatient" required>
                        <option value="">Select Patient</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Diagnosis *</label>
                    <input type="text" id="recordDiagnosis" placeholder="e.g., Hypertension" required>
                </div>
                <div class="form-group">
                    <label>Treatment</label>
                    <input type="text" id="recordTreatment" placeholder="e.g., Prescribed medication">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="recordNotes" rows="3" placeholder="Additional notes..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('recordModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Record</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
